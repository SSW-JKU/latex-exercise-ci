[tool.ruff]
target-version = "py313"
line-length = 120
src = ["latex_build_action", "tests", "action_tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing-comma rule: conflicts with the formatter
    "ISC001",  # implicit string concat: conflicts with the formatter
    "D203",    # 1 blank line before class docstring (conflicts with D211)
    "D213",    # multi-line docstring summary on second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]        # allow assert, magic numbers, skip docstrings
"action_tests/**" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.isort]
known-first-party = ["latex_build_action"]

[tool.ruff.format]
docstring-code-format = true
# skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
warn_unreachable = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
