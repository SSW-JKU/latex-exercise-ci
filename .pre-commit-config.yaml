default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # https://github.com/schollm/check-dependencies
  - repo: local
    hooks:
      - id: check-dependencies
        name: check-dependencies
        entry: uv run check-dependencies
        language: system
        pass_filenames: false
        args: [--include-dev, latex_build_action, tests, action_tests]
