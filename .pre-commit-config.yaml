default_install_hook_types:
  - pre-commit
  - commit-msg

repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: Type Check
        language: system
        entry: mypy -p latex_build_action -p tests -p action_tests
        pass_filenames: false
        files: \.py$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
