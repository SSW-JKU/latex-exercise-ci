name: Build CI

on:
  push:

jobs:
  pre-commit:
    name: "Pre-commit (lint + format + typecheck)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - uses: pre-commit/action@v3.0.1

  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Run type check
        run: uv run mypy

  unit-test:
    name: "Unit Test"
    runs-on: ubuntu-latest
    needs: ["pre-commit", "typecheck"]
    strategy:
      matrix:
        python-version: ["3.13"]
        texlive-version: ["2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Setup TeX Live
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: ${{ matrix.texlive-version }}
          packages: >-
            scheme-basic
            latexmk
      - name: Run unittests
        run: uv run pytest

  integration-test:
    name: "Integration Test (${{ matrix.scenario }})"
    runs-on: ubuntu-latest
    needs: ["unit-test"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        texlive-version: ["2026"]
        scenario:
          # old build system
          - old_build_success_no_checksum
          - old_build_success_same_checksum
          - old_build_success_same_checksum_no_pdf
          - old_build_success_wrong_checksum
          - old_build_failure_new_file
          - old_build_failure_no_checksum
          - old_build_failure_update_file
          # new build system
          - new_build_success_no_checksum
          - new_build_success_same_checksum
          - new_build_success_same_checksum_no_pdf
          - new_build_success_wrong_checksum
          - new_build_failure_new_file
          - new_build_failure_no_checksum
          - new_build_failure_update_file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Prepare scenario
        run: python -m action_tests --scenario-dir "action_tests/defs" prepare ${{ matrix.scenario }}

      - name: Run scenario
        id: test-execution
        uses: ./
        # scenarios named *_failure_* are expected to fail the action
        continue-on-error: ${{ contains(matrix.scenario, '_failure_') }}
        with:
          working_directory: /tmp/test-locals/${{ matrix.scenario }}
          config_file_name: config.json
          commit_user_name: Integration Test Build[bot]
          commit_user_email: integration-test-bot@users.noreply.github.com
          python_version: ${{ matrix.python-version }}
          texlive_version: ${{ matrix.texlive-version }}
          texlive_packages: >-
            scheme-basic
            cleveref
            hyperref
            latexmk
            eurosym
            xsim
            babel-german
            hyphen-german
            csquotes
            csquotes-de
            wrapfig
            tcolorbox
            paracol
            mdframed
            koma-script
            pgf
            environ
            booktabs
            enumitem
            listings
            soul
            caption
            fontawesome5
            zref
            needspace
            tikzfill
            pdfcol
            listingsutf8
            xstring

      - name: Verify scenario
        if: always()
        run: python -m action_tests --scenario-dir "action_tests/defs" verify ${{ steps.test-execution.outcome }} ${{ matrix.scenario }}

  deploy:
    name: "Create release"
    needs: ["unit-test", "integration-test"]
    if: "${{ startsWith(github.ref, 'refs/tags/') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # read changelog for release notes
      - name: Prepare release notes
        id: changelog
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          echo "TAG=$TAG_NAME" >> $GITHUB_ENV
          NOTES=$(awk "/^## \[${TAG_NAME:1}\]/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          cat $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: ${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
