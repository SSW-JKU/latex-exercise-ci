name: Build CI

on:
  push:

jobs:
  pre-commit:
    name: "Pre-commit (lint + format + typecheck)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - uses: pre-commit/action@v3.0.1

  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Run type check
        run: uv run mypy

  unit-test:
    name: "Unit Test"
    runs-on: ubuntu-latest
    needs: ["pre-commit", "typecheck"]
    strategy:
      matrix:
        python-version: ["3.13"]
        texlive-version: ["2026"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Setup TeX Live
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: ${{ matrix.texlive-version }}
          packages: >-
            scheme-basic
            latexmk
      - name: Run unittests
        run: uv run pytest

  integration-test:
    name: "Integration Test (${{ matrix.scenario }})"
    runs-on: ubuntu-latest
    needs: ["unit-test"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        texlive-version: ["2026"]
        scenario:
          # old build system
          - old_build_success_no_checksum
          - old_build_success_same_checksum
          - old_build_success_same_checksum_no_pdf
          - old_build_success_wrong_checksum
          - old_build_failure_new_file
          - old_build_failure_no_checksum
          - old_build_failure_update_file
          # new build system
          - new_build_success_no_checksum
          - new_build_success_same_checksum
          - new_build_success_same_checksum_no_pdf
          - new_build_success_wrong_checksum
          - new_build_failure_new_file
          - new_build_failure_no_checksum
          - new_build_failure_update_file
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Prepare scenario
        run: uv run gh-action-integration-test --scenario-dir "action_tests/defs" prepare ${{ matrix.scenario }}

      - name: Run scenario
        id: test-execution
        uses: ./
        # scenarios named *_failure_* are expected to fail the action
        continue-on-error: ${{ contains(matrix.scenario, '_failure_') }}
        with:
          working_directory: /tmp/test-locals/${{ matrix.scenario }}
          config_file_name: config.json
          commit_user_name: Integration Test Build[bot]
          commit_user_email: integration-test-bot@users.noreply.github.com
          python_version: ${{ matrix.python-version }}
          texlive_version: ${{ matrix.texlive-version }}
          texlive_packages: >-
            scheme-basic
            cleveref
            hyperref
            latexmk
            eurosym
            xsim
            babel-german
            hyphen-german
            csquotes
            csquotes-de
            wrapfig
            tcolorbox
            paracol
            mdframed
            koma-script
            pgf
            environ
            booktabs
            enumitem
            listings
            soul
            caption
            fontawesome5
            zref
            needspace
            tikzfill
            pdfcol
            listingsutf8
            xstring

      - name: Verify scenario
        if: always()
        run: uv run gh-action-integration-test --scenario-dir "action_tests/defs" verify ${{ steps.test-execution.outcome }} ${{ matrix.scenario }}

  # --- Release pipeline: only runs for v* tags pointing at a commit on main ---

  guard:
    name: "Release prerequisite: version tagged main"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF_NAME is not on main, skipping."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  changelog:
    name: "Update changelog"
    needs: ["guard", "unit-test", "integration-test"]
    if: needs.guard.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: changelog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Runs on the tagged commit, so the new tag is the newest release section.
      # Output goes to a temp name so switching branches can't clash with an
      # existing CHANGELOG.md.
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.generated.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          mv CHANGELOG.generated.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog unchanged."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(changelog): update for $GITHUB_REF_NAME [skip ci]"
          git push origin main

  deploy:
    name: "Create release"
    needs: ["guard", "unit-test", "integration-test"]
    if: needs.guard.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Notes for just this tag, generated from the commits since the previous one
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Tags like v1.2.0-rc.1 are published as pre-releases
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            $flags
